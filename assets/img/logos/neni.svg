<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 44" role="img" aria-label="Neni Technologies USA">
  <!-- NT monogram mark -->
  <g transform="translate(8,6)">
    <rect width="28" height="32" rx="3" fill="none" stroke="white" stroke-width="1.5"/>
    <text x="14" y="22"
          text-anchor="middle"
          font-family="'Arial Black',Arial,sans-serif"
          font-size="16" font-weight="900"
          fill="white">NT</text>
  </g>
  <!-- NENI wordmark -->
  <text x="48" y="22"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="18" font-weight="700"
        fill="white" letter-spacing="1">NENI</text>
  <!-- Technologies USA -->
  <text x="48" y="36"
        font-family="Arial,sans-serif"
        font-size="9" font-weight="400"
        fill="white" opacity="0.75" letter-spacing="1">TECHNOLOGIES · USA</text>
</svg>
