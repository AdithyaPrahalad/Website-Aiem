<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" role="img" aria-label="Neni Technologies USA">
  <!-- Neni: tech blue #4DA6FF — NT monogram + wordmark -->
  <!-- NT badge -->
  <rect x="2" y="6" width="34" height="36" rx="4" fill="none" stroke="#4DA6FF" stroke-width="1.8"/>
  <text x="19" y="29" text-anchor="middle"
        font-family="'Arial Black',Arial,sans-serif"
        font-size="16" font-weight="900"
        fill="#4DA6FF">NT</text>
  <!-- NENI bold -->
  <text x="48" y="26"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="19" font-weight="700"
        fill="#4DA6FF" letter-spacing="1">NENI</text>
  <!-- sub-label -->
  <text x="48" y="40"
        font-family="Arial,sans-serif"
        font-size="9.5" fill="#4DA6FF" opacity="0.75">TECHNOLOGIES · USA</text>
</svg>
