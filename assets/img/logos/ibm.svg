<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 58" role="img" aria-label="IBM Partner Plus">
  <defs>
    <pattern id="s8" x="0" y="0" width="200" height="58" patternUnits="userSpaceOnUse">
      <rect y="0"  width="200" height="6"  fill="white"/>
      <rect y="10" width="200" height="6"  fill="white"/>
      <rect y="20" width="200" height="6"  fill="white"/>
      <rect y="30" width="200" height="6"  fill="white"/>
      <rect y="40" width="200" height="6"  fill="white"/>
    </pattern>
    <mask id="ibm-mask">
      <!-- I -->
      <rect x="2"  y="2"  width="14" height="44" fill="white"/>
      <!-- B spine + bumps -->
      <rect x="24" y="2"  width="11" height="44" fill="white"/>
      <path d="M35,2 h10 a11,12 0 0 1 0,22 h-10 Z" fill="white"/>
      <path d="M35,24 h12 a11,12 0 0 1 0,22 h-12 Z" fill="white"/>
      <!-- M two legs + chevron -->
      <rect x="58" y="2"  width="11" height="44" fill="white"/>
      <rect x="107" y="2" width="11" height="44" fill="white"/>
      <polygon points="58,2 118,2 88,26" fill="white"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="200" height="46" fill="url(#s8)" mask="url(#ibm-mask)"/>
  <!-- Partner Plus label safely below the stripes -->
  <text x="60" y="57" text-anchor="middle"
        font-family="Arial,sans-serif"
        font-size="9.5" fill="white" opacity="0.8" letter-spacing="1.2">PARTNER PLUS</text>
</svg>
