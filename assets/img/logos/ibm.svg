<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 52" role="img" aria-label="IBM Partner Plus">
  <defs>
    <!-- Horizontal stripe pattern identical to IBM brand guidelines (8-stripe) -->
    <pattern id="s8" x="0" y="0" width="160" height="52" patternUnits="userSpaceOnUse">
      <rect y="0"  width="160" height="6"  fill="white"/>
      <rect y="10" width="160" height="6"  fill="white"/>
      <rect y="20" width="160" height="6"  fill="white"/>
      <rect y="30" width="160" height="6"  fill="white"/>
      <rect y="40" width="160" height="6"  fill="white"/>
    </pattern>
    <mask id="ibm-mask">
      <!-- I column -->
      <rect x="2"  y="2"  width="14" height="48" rx="0" fill="white"/>
      <!-- B spine + two bumps -->
      <rect x="24" y="2"  width="11" height="48" fill="white"/>
      <path d="M35,2 h10 a11,14 0 0 1 0,22 h-10 Z" fill="white"/>
      <path d="M35,24 h12 a11,14 0 0 1 0,26 h-12 Z" fill="white"/>
      <!-- M two legs + v-notch -->
      <rect x="58" y="2"  width="11" height="48" fill="white"/>
      <rect x="107" y="2" width="11" height="48" fill="white"/>
      <polygon points="58,2 118,2 88,28" fill="white"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="160" height="52" fill="url(#s8)" mask="url(#ibm-mask)"/>
  <!-- Partner Plus label -->
  <text x="80" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="white" opacity="0.7" letter-spacing="1.5">PARTNER PLUS</text>
</svg>
