<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 68" role="img" aria-label="IBM Partner Plus">
  <!-- IBM classic 8-stripe wordmark in IBM Blue #1F70C1 -->
  <!-- Approach: solid blue letters, white horizontal stripes cut across them -->
  <defs>
    <mask id="ibm-letters">
      <!-- I — two serifs top/bottom + column -->
      <rect x="2"   y="4" width="26"  height="8"  fill="white" rx="1"/> <!-- top serif -->
      <rect x="9"   y="4" width="12"  height="44" fill="white"/>        <!-- column -->
      <rect x="2"   y="40" width="26" height="8"  fill="white" rx="1"/> <!-- bottom serif -->
      <!-- B — spine + two right bumps -->
      <rect x="36"  y="4" width="12"  height="44" fill="white"/>
      <path d="M48,4 Q68,4 68,17 Q68,26 48,26Z"   fill="white"/>
      <path d="M48,26 Q70,26 70,37 Q70,48 48,48Z" fill="white"/>
      <!-- M — two legs + inverted-V notch -->
      <rect x="80"  y="4" width="12"  height="44" fill="white"/>
      <rect x="128" y="4" width="12"  height="44" fill="white"/>
      <polygon points="80,4 140,4 110,30" fill="white"/>
    </mask>
    <!-- 8 horizontal stripes in IBM blue, masked to letter shapes -->
    <clipPath id="ibm-stripes">
      <rect x="0" y="4"  width="160" height="6"/>
      <rect x="0" y="14" width="160" height="6"/>
      <rect x="0" y="24" width="160" height="6"/>
      <rect x="0" y="34" width="160" height="6"/>
      <rect x="0" y="44" width="160" height="6"/>
    </clipPath>
  </defs>
  <!-- Solid blue fill through letter shapes, clipped to stripes -->
  <rect x="0" y="0" width="160" height="52" fill="#1F70C1" mask="url(#ibm-letters)" clip-path="url(#ibm-stripes)"/>
  <!-- PARTNER PLUS label in IBM blue, lighter -->
  <text x="80" y="66"
        text-anchor="middle"
        font-family="'IBM Plex Sans',Arial,sans-serif"
        font-size="10" font-weight="600"
        fill="#5aaae0" letter-spacing="2">PARTNER PLUS</text>
</svg>
