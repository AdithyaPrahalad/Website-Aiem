<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 44" role="img" aria-label="SAP Partners">
  <!-- SAP rounded rectangle badge -->
  <rect x="2" y="5" width="72" height="34" rx="5" ry="5" fill="none" stroke="white" stroke-width="2"/>
  <!-- SAP bold text inside badge -->
  <text x="38" y="28"
        text-anchor="middle"
        font-family="'Arial Black',Arial,sans-serif"
        font-size="22" font-weight="900"
        fill="white">SAP</text>
  <!-- Partners label to the right -->
  <text x="86" y="28"
        font-family="Arial,sans-serif"
        font-size="11" font-weight="600"
        fill="white" opacity="0.8">Partners</text>
</svg>
