<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 44" role="img" aria-label="SAP Partners">
  <!-- SAP rounded badge in SAP brand blue #009FDB -->
  <rect x="2" y="4" width="76" height="36" rx="5" fill="#009FDB"/>
  <!-- SAP in white inside badge -->
  <text x="40" y="28" text-anchor="middle"
        font-family="'Arial Black',Arial,sans-serif"
        font-size="22" font-weight="900"
        fill="white">SAP</text>
  <!-- Partners in SAP blue to the right -->
  <text x="90" y="28"
        font-family="Arial,sans-serif"
        font-size="14" font-weight="600"
        fill="#009FDB">Partners</text>
</svg>
