<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 44" role="img" aria-label="SAP Partners">
  <!-- SAP rounded rectangle badge -->
  <rect x="2" y="2" width="70" height="38" rx="5" ry="5" fill="none" stroke="white" stroke-width="2"/>
  <!-- SAP bold text inside badge -->
  <text x="37" y="28"
        text-anchor="middle"
        font-family="'Arial Black',Arial,sans-serif"
        font-size="22" font-weight="900"
        fill="white">SAP</text>
  <!-- Partners label -->
  <text x="80" y="28"
        font-family="Arial,sans-serif"
        font-size="10" font-weight="600"
        fill="white" opacity="0.7" letter-spacing="0.5">Partners</text>
</svg>
