<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 72" role="img" aria-label="TCS">
  <!-- TCS brand magenta #E31C79 swoosh ring, centred in viewBox -->
  <!-- Ring -->
  <circle cx="70" cy="30" r="24" fill="none" stroke="#E31C79" stroke-width="3" opacity="0.9"/>
  <!-- Swoosh: top-left thick arc in brand magenta -->
  <path d="M48,30 A24,24 0 0 1 92,30"
        fill="none" stroke="#E31C79" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <!-- tcs wordmark in white centred inside ring -->
  <text x="70" y="37" text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif"
        font-size="18" font-weight="700"
        fill="white" letter-spacing="-0.5">tcs</text>
  <!-- Sub-label BELOW the ring with clear gap -->
  <text x="70" y="64" text-anchor="middle"
        font-family="Arial,sans-serif"
        font-size="8.5" fill="#E31C79" opacity="0.9">TATA CONSULTANCY SERVICES</text>
</svg>
